<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site concepts | LSDigitalsAI</title>
<style>
  :root{--navy:#12395C;--accent:#E08A2E;--muted:#5A6B7B;--line:#E2E8EE}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#16202B;background:#fff;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:64px 24px}
  h1{color:var(--navy);font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin:0 0 10px}
  p.lede{color:var(--muted);margin:0 0 36px}
  a.item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--navy);font-weight:700}
  a.item span{color:var(--muted);font-weight:500;font-size:14px}
  a.item:hover span{color:var(--accent)}
  footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Site concepts</h1>
  <p class="lede">Concept designs prepared for local businesses. Each link opens the full site concept.</p>
  <a class="item" href="trey-hyatt-plumbing/">Trey Hyatt Plumbing <span>Tallahassee, FL · plumber</span></a>
  <footer>Prepared by LSDigitalsAI · logansdigitalsai@gmail.com</footer>
</div>
</body>
</html>
